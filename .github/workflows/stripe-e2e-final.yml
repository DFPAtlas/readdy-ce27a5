name: Stripe final end-to-end verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/stripe-e2e-final.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Test checkout, reuse and signed webhook
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create and repeat test checkout
        shell: bash
        run: |
          set -euo pipefail

          EMAIL="stripe-final-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          cat > payload.json <<JSON
          {
            "packageId": "launch",
            "customerName": "DFP Stripe Test",
            "customerEmail": "${EMAIL}",
            "customerPhone": "07700900123",
            "businessName": "DFP Automated Test",
            "billingAddress": "1 Test Street",
            "billingPostcode": "SW1A 1AA",
            "billingCountry": "GB",
            "existingWebsite": "https://example.com",
            "projectDescription": "Final automated Stripe test-mode verification",
            "preferredContact": "email"
          }
          JSON

          ENDPOINT="https://zjqftnkrmqhmbrtkvafy.supabase.co/functions/v1/dfp-website-checkout"

          for ATTEMPT in 1 2; do
            CODE=$(curl --silent --show-error \
              --output "checkout-${ATTEMPT}.json" \
              --write-out '%{http_code}' \
              --request POST "$ENDPOINT" \
              --header 'Origin: https://digital-footprint.uk' \
              --header 'Content-Type: application/json' \
              --data @payload.json)

            echo "Checkout attempt ${ATTEMPT}: HTTP ${CODE}"
            jq '{sessionId, projectReference, reused, hasUrl: (.url | type == "string")}' "checkout-${ATTEMPT}.json"
            [[ "$CODE" == "200" ]] || { cat "checkout-${ATTEMPT}.json"; exit 1; }
          done

          SESSION_ONE=$(jq -r '.sessionId' checkout-1.json)
          SESSION_TWO=$(jq -r '.sessionId' checkout-2.json)
          REF_ONE=$(jq -r '.projectReference' checkout-1.json)
          REF_TWO=$(jq -r '.projectReference' checkout-2.json)
          REUSED=$(jq -r '.reused' checkout-2.json)

          [[ "$SESSION_ONE" == cs_test_* ]] || { echo "::error::Non-test Stripe session returned. Payment was not attempted."; exit 1; }
          [[ "$SESSION_ONE" == "$SESSION_TWO" ]] || { echo "::error::Duplicate session mismatch"; exit 1; }
          [[ "$REF_ONE" == "$REF_TWO" ]] || { echo "::error::Duplicate reference mismatch"; exit 1; }
          [[ "$REUSED" == "true" ]] || { echo "::error::Repeat submission was not reused"; exit 1; }

          jq -r '.url' checkout-1.json > checkout-url.txt
          echo "Test mode and duplicate reuse passed for ${REF_ONE}"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Pay through Stripe hosted Checkout
        shell: bash
        run: |
          cat > stripe-final.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const checkoutUrl = fs.readFileSync('checkout-url.txt', 'utf8').trim();
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ locale: 'en-GB' });

          async function visible(selectors, timeoutMs = 30000) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              for (const frame of page.frames()) {
                for (const selector of selectors) {
                  const locator = frame.locator(selector).first();
                  try {
                    if (await locator.count() && await locator.isVisible()) return locator;
                  } catch {
                    // Stripe frame may navigate while searching.
                  }
                }
              }
              await page.waitForTimeout(250);
            }
            return null;
          }

          async function fill(label, selectors, value, required = true) {
            const locator = await visible(selectors, required ? 45000 : 5000);
            if (!locator) {
              if (required) throw new Error(`Could not find ${label}`);
              console.log(`Optional field not displayed: ${label}`);
              return null;
            }
            await locator.fill(value);
            console.log(`Filled ${label}`);
            return locator;
          }

          try {
            await page.goto(checkoutUrl, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForTimeout(4000);
            console.log(`Stripe page title: ${await page.title()}`);

            const gbp = await visible([
              'button:has-text("£747.50")',
              'button:has-text("GBP")'
            ], 7000);
            if (gbp) {
              await gbp.click();
              await page.waitForTimeout(1000);
              console.log('Selected GBP');
            }

            await fill('telephone', [
              'input[name="phoneNumber"]',
              'input[type="tel"]'
            ], '07700900123');

            await fill('card number', [
              'input[name="cardNumber"]',
              'input[autocomplete="cc-number"]',
              'input[aria-label*="card number" i]'
            ], '4242424242424242');

            await fill('expiry', [
              'input[name="cardExpiry"]',
              'input[autocomplete="cc-exp"]',
              'input[aria-label*="expiration" i]',
              'input[aria-label*="expiry" i]'
            ], '1234');

            await fill('security code', [
              'input[name="cardCvc"]',
              'input[autocomplete="cc-csc"]',
              'input[aria-label*="security code" i]',
              'input[aria-label*="cvc" i]'
            ], '123');

            await fill('billing name', [
              'input[name="billingName"]',
              'input[autocomplete="cc-name"]'
            ], 'DFP Stripe Test', false);

            const address = await fill('address line 1', [
              'input[name="billingAddressLine1"]',
              'input[autocomplete="address-line1"]'
            ], '1 Test Street', false);
            if (address) await address.press('Escape').catch(() => {});

            await fill('town or city', [
              'input[name="billingLocality"]',
              'input[autocomplete="address-level2"]',
              'input[placeholder*="Town" i]',
              'input[placeholder*="city" i]'
            ], 'London');

            await fill('postcode', [
              'input[name="billingPostalCode"]',
              'input[autocomplete="postal-code"]'
            ], 'SW1A 1AA');

            await page.screenshot({ path: 'before-payment.png', fullPage: true });

            const pay = await visible([
              'button[type="submit"]',
              'button:has-text("Pay")'
            ], 30000);
            if (!pay) throw new Error('Could not find Stripe payment button');

            await pay.click();
            await page.waitForURL(/digital-footprint\.uk\/checkout\/success/, { timeout: 120000 });
            fs.writeFileSync('success-url.txt', page.url());
            await page.screenshot({ path: 'after-payment.png', fullPage: true });
            console.log('Stripe test payment redirected to the DFP success page');
          } catch (error) {
            console.error(error);
            const alerts = await page.locator('[role="alert"]').allTextContents().catch(() => []);
            console.error('Visible alerts:', alerts);
            await page.screenshot({ path: 'payment-failure.png', fullPage: true }).catch(() => {});
            throw error;
          } finally {
            await browser.close();
          }
          JS

          node stripe-final.mjs

      - name: Confirm webhook marked order paid
        shell: bash
        run: |
          set -euo pipefail
          REF=$(jq -r '.projectReference' checkout-1.json)
          SESSION=$(jq -r '.sessionId' checkout-1.json)
          STATUS_URL="https://zjqftnkrmqhmbrtkvafy.supabase.co/functions/v1/dfp-website-checkout-status?ref=${REF}&session_id=${SESSION}"

          for ATTEMPT in $(seq 1 30); do
            CODE=$(curl --silent --show-error \
              --output status.json \
              --write-out '%{http_code}' \
              --header 'Origin: https://digital-footprint.uk' \
              "$STATUS_URL")

            PAYMENT_STATUS=$(jq -r '.payment_status // empty' status.json)
            echo "Status ${ATTEMPT}: HTTP ${CODE}, payment_status=${PAYMENT_STATUS:-missing}"

            if [[ "$CODE" == "200" && "$PAYMENT_STATUS" == "paid" ]]; then
              jq . status.json
              echo "Signed Stripe webhook marked the order paid"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Webhook did not mark the order paid"
          cat status.json
          exit 1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-final-diagnostics
          path: |
            checkout-1.json
            checkout-2.json
            status.json
            success-url.txt
            before-payment.png
            after-payment.png
            payment-failure.png
          if-no-files-found: ignore
          retention-days: 1
